notes:
- >-
  Legend's API is read-only in public. There is no order-placement endpoint on
  api.legend.trade — orders are placed through Legend's apps, the Telegram bot,
  or Hyperliquid directly, so no trading tools are proposed here.
- >-
  The WebSocket surface (asyncapi/legendtrade-ws-asyncapi.yml) would suit an
  MCP resource subscription rather than a tool; it is not modelled as tools.

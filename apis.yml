aid: legendtrade
name: LegendTrade
description: >-
  Legend (legend.trade) is a competitive social trading platform — it describes itself as "the esports
  layer for trading". Users trade perpetual contracts across 500+ crypto, equity, and commodity markets
  with leverage, and the platform wraps that in game mechanics: Arena head-to-head duels with ELO
  ratings and wagers, clans, leaderboards, a social feed, referrals, and copy trading that mirrors top
  traders in a single tap. Orders placed on Legend execute on Hyperliquid's on-chain order book, with
  Legend charging a builder-code platform fee on top of Hyperliquid's volume-tiered maker/taker fees.
  Legend is available on iOS, Android, web, and through a Telegram bot. Its programmable surface is a
  Hyperliquid-compatible read API at api.legend.trade (a multiplexed POST /info endpoint, custom
  sparklines, and an authenticated wallet-registration surface) plus a subscription-based WebSocket
  carrying market-data and account channels. Legend is backed by Electric Capital.
